<body class="hold-transition sidebar-mini layout-fixed">

<!-- ============================== LOGIN ============================== -->
<div id="login-view" class="pd-login d-none">
  <div class="pd-login-card card">
    <div class="card-body p-4 p-md-5">
      <div class="pd-brand mb-4">
        <div class="pd-monogram">PD</div>
        <div>
          <h1 class="h4 mb-0">Presensi Desa</h1>
          <p class="text-muted small mb-0">Panel Pengelola &amp; Superadmin</p>
        </div>
      </div>
      <form id="login-form" autocomplete="off">
        <div class="form-group">
          <label for="login-nipd">NIPD / Username</label>
          <input id="login-nipd" class="form-control form-control-lg" required autofocus>
        </div>
        <div class="form-group">
          <label for="login-pin">PIN (6 digit)</label>
          <input id="login-pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                 class="form-control form-control-lg" required>
        </div>
        <div id="login-error" class="alert alert-danger py-2 small d-none"></div>
        <button id="login-submit" class="btn btn-primary btn-lg btn-block" type="submit">Masuk</button>
      </form>
      <p class="text-muted small mt-4 mb-0">
        Hanya akun pengelola desa dan superadmin yang dapat masuk di sini.
        Petugas absensi memakai aplikasi Android.
      </p>
    </div>
  </div>
</div>

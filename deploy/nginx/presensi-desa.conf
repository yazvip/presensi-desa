# absen.talangarah.web.id — Presensi Desa API (node 127.0.0.1:8181).
# Berkas terpisah; tidak menggabung atau mengubah vhost mutasi.rajacek.com.
server {
    listen 80;
    listen [::]:80;
    server_name absen.talangarah.web.id;

    location /.well-known/acme-challenge/ {
        root /var/www/presensi-desa;
    }

    # Panel admin (berkas statis): hanya /admin/, /admin/index.html, dan /admin/assets/.
    # Endpoint API seperti /admin/locations, /admin/rekap, /admin/staff diteruskan ke Node.js.
    location = /admin {
        return 301 /admin/;
    }

    location = /admin/ {
        alias /var/www/presensi-desa/admin/index.html;
        default_type text/html;
    }

    location = /admin/index.html {
        alias /var/www/presensi-desa/admin/index.html;
        default_type text/html;
    }

    location /admin/assets/ {
        alias /var/www/presensi-desa/admin/assets/;
    }

    location / {
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }
}

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — tes & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Pasang dependensi
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Tes unit
        run: npx tsx --test test/*.test.ts

  android:
    name: Android — APK debug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pastikan Android SDK 35
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          fi

      - name: Pasang Gradle 8.11.1
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.kts', 'android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APK debug
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -o pipefail
          BASE="${API_BASE_URL:-https://absen.talangarah.web.id/}"
          gradle --no-daemon --stacktrace assembleDebug -PAPI_BASE_URL="$BASE" 2>&1 \
            | tee "$RUNNER_TEMP/build.log"

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: presensi-desa-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Simpan log build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7

  status:
    name: Ringkasan status ke branch ci-status
    needs: [backend, android]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Ambil log build bila ada
        uses: actions/download-artifact@v4
        with:
          name: build-log
          path: build-log
        continue-on-error: true

      - name: Tulis dan dorong ringkasan
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          BACKEND: ${{ needs.backend.result }}
          ANDROID: ${{ needs.android.result }}
        run: |
          set -eu
          mkdir -p /tmp/publish
          cd /tmp/publish
          {
            echo "commit: $COMMIT"
            echo "waktu: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "backend: $BACKEND"
            echo "android: $ANDROID"
          } > status.txt
          if [ -f "$GITHUB_WORKSPACE/build-log/build.log" ]; then
            tail -c 60000 "$GITHUB_WORKSPACE/build-log/build.log" > build.log
          else
            echo "(log build tidak tersedia)" > build.log
          fi
          git init -q
          git checkout -q -b ci-status
          git add status.txt build.log
          git -c user.name=ci-status -c user.email=ci-status@users.noreply.github.com \
              commit -q -m "status $COMMIT: backend=$BACKEND android=$ANDROID"
          git push -f "https://x-access-token:$TOKEN@github.com/$REPO.git" ci-status
